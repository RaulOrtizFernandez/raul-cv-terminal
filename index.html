<div class="page">

  <nav class="quiet-nav" aria-label="Navegación rápida por secciones del CV">

    <button type="button" data-run-command="experience">Experience</button>

  <section class="terminal" data-terminal aria-label="Terminal interactiva de currículum">
    <div class="titlebar">
      <div class="titlebar-left">
        <span class="dot dot--red" aria-hidden="true"></span>
        <span class="dot dot--yellow" aria-hidden="true"></span>
        <span class="dot dot--green" aria-hidden="true"></span>

      </div>
      <div class="status"><span class="dot" aria-hidden="true"></span>online</div>
    </div>

    <div class="screen" data-output role="log" aria-live="polite"></div>

    <div class="chips" aria-hidden="false">
      <button class="chip" type="button" data-run-command="about">about</button>
      <button class="chip" type="button" data-run-command="experience">experience</button>
      <button class="chip" type="button" data-run-command="education">education</button>

      <button class="chip" type="button" data-run-command="cv">cv</button>
      <button class="chip" type="button" data-run-command="clear">clear</button>
    </div>

    <form class="inputrow" data-form onsubmit="return false;">
      <label class="prompt" for="terminal-input">raul@portfolio:~$</label>
      <input
        id="terminal-input"
        data-input
        type="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Escribe un comando, por ejemplo help"
        placeholder="type a command… try 'help'"
